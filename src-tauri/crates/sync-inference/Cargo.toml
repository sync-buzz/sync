[package]
name = "sync-inference"
description = "Local model inference: the runtimes this machine can load, and the shape a model's manifest takes"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
