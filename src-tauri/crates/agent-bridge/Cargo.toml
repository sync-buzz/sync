[package]
name = "agent-bridge"
description = "ACP bridge for agent CLIs whose native process protocol differs from ACP."
version = "0.1.0"
# See the note in `acp-client`: ported whole from the previous Sync, edition
# included.
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "io-std",
    "process",
    "sync",
    "macros",
    "rt",
] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "io-util",
] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"
