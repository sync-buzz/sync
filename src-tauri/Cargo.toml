[workspace]
members = ["crates/*"]
# `sync-mcp` links the memory engine, which brings LanceDB and llama.cpp with
# it. Neither belongs in the window's build, and an ordinary `cargo check` here
# is the window's build — so the sidecar is a member that is not a default one,
# reached with `-p sync-mcp` when it is the thing being worked on.
default-members = [".", "crates/sync-memory", "crates/sync-terminal", "crates/sync-extensions", "crates/sync-handlers", "crates/sync-vault", "crates/sync-voice", "crates/sync-inference", "crates/sync-mcp-client", "crates/acp-client", "crates/agent-bridge"]

[package]
name = "sync"
version = "0.14.0"
# The workspace's default members hold two binaries — this window and the ACP
# stub agent one test raises — so `cargo run` has two to choose from and picks
# neither. Naming the window here is what `tauri dev` needs to start at all.
default-run = "sync"
description = "Sync desktop shell"
authors = ["Sync"]
license = "FSL-1.1-MIT"
repository = "https://github.com/sync-buzz/sync"
edition = "2024"
# Raised by the engine: `sync-mcp` links memory-hub, which is built for 1.91
# and edition 2024. Cargo resolves one graph for the whole workspace against
# the lowest floor in it, so leaving this at 1.85 picked dependency versions
# the engine cannot build with.
rust-version = "1.91"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
tempfile = "3"

[lib]
name = "sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# The agents this window drives, and the bridge for the one that does not speak
# ACP natively. Both are leaf crates: they know the protocol and the CLIs, and
# nothing about Tauri or about this application.
acp-client = { path = "crates/acp-client" }
agent-bridge = { path = "crates/agent-bridge" }
async-trait = "0.1.92"
# An image pasted into a conversation crosses the window boundary as base64 —
# the protocol's own spelling for one — and is decoded here to be held as the
# bytes it is. Already in the tree for the memory crates; this is the first
# time the application itself needs it.
base64 = "0.22"
getrandom = "0.3"
# Encoding a model's sha256 as hex. Already in the tree under `sync-extensions`.
hex = "0.4"
jsonc-parser = { version = "0.33.1", features = ["serde"] }
# The words a working tree is named with. Two trees made from `main` on the
# same afternoon are identical in everything git holds about them, so the name
# is the only thing anybody can choose between them by — and a word list is
# exactly the kind of thing that is worse when written by hand: ours would be
# fifty words long, repeat itself by the third tree, and be nobody's job to
# extend. The command line half of the crate is left out; only the lists and
# the generator are wanted here.
petname = { version = "3.2.0", default-features = false, features = [
    "default-rng",
    "default-words",
] }
# Asking a model server on this machine what it is holding, and nothing else:
# one GET to the loopback before an agent is raised. Async rather than the
# blocking client its neighbour crate takes — this call is made from inside a
# session being opened, and a blocking one there would hold a runtime thread
# for as long as a server that is loading weights takes to answer. `rustls`
# rather than the platform's TLS, so the tree has one behaviour to reason
# about; already in the graph under `sync-extensions`, so this costs no new
# dependency.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# Reading an address back: every segment of a `sync://` url is escaped by
# `link.rs` on the way out, so it is unescaped here on the way in. The same
# spelling as its neighbours in the tree, so the graph gains nothing.
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verifying a downloaded model's bytes against the sha256 its manifest carries.
# Already in the tree under `sync-extensions` and `sync-memory`; the same
# spelling, so no new dependency is added to the graph.
sha2 = "0.10"
sync-extensions = { path = "crates/sync-extensions" }
# What an extension runs when no screen is mounted. Tauri-free like its
# neighbours: it takes a module and a name and answers, and everything it is
# allowed to reach is decided in `handlers.rs`, where the project is known.
sync-handlers = { path = "crates/sync-handlers" }
# The keychain, and the only crate in the tree that opens one. Beside the
# application rather than inside it for the reason its neighbours are: a crate
# that cannot see the application cannot widen its own reach, so what it may do
# is decided in `src/vault.rs` and how it is done is decided in the crate.
sync-vault = { path = "crates/sync-vault" }
sync-memory = { path = "crates/sync-memory" }
# The client half of MCP: a project-scoped server declared in the project record
# is reached as a client, per-call, by the command layer's unified tool-call
# door. A leaf crate — no engine — so it costs the window's build nothing heavy.
sync-mcp-client = { path = "crates/sync-mcp-client" }
# The pty, and the process on the far end of it. Tauri-free like its
# neighbours: it holds terminals under an owner it is handed, and who may ask
# for one — and which project the owner is — is decided in `src/terminal.rs`.
sync-terminal = { path = "crates/sync-terminal" }
# What the machine says out loud. Tauri-free like its neighbours: it takes a
# sentence and says it, and who may ask for one is decided in `voice.rs`, where
# the installation's chosen voice is known.
sync-voice = { path = "crates/sync-voice" }
# Local model inference: the runtimes this machine can load, and the shape a
# model's manifest takes. Tauri-free like its neighbours — it takes a manifest
# and an input and answers, and who may ask is decided in `models.rs`.
sync-inference = { path = "crates/sync-inference" }
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
# What makes `sync://` an address the whole machine can follow. The plugin
# earns its place twice: the schemes in `tauri.conf.json` are what the
# bundler writes into `CFBundleURLTypes`, which is the only way macOS ever
# hears of the scheme, and the same declaration is what a link arriving as a
# command line argument is matched against off the Mac. Nothing of it is
# granted to the webview: an address is routed in `src/links.rs`, which has
# to choose a window before there is a window to ask.
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-dialog = "2.7.2"
# The one key that reaches Sync while another application is in front. The
# shortcut is registered in Rust and nothing of this plugin is granted to the
# webview: the key has to work with every window closed, which is precisely
# when there is no webview to ask. What it opens is `src/ask.rs`.
tauri-plugin-global-shortcut = "2"
# The banner, and it is the whole of what this window can say from behind
# another application. Raised in Rust and never through the webview — a
# notification asked for by a window would exist only while a window does,
# which is exactly when nobody needs one — so like the updater's, none of this
# plugin's commands appear in a capability. What is said, and when, is
# `src/attention.rs`.
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5"
# Updating happens behind the window and never through it: the plugin's
# commands are in no capability, so the whole flow is `src/updates.rs`.
tauri-plugin-updater = "2"
# The agent connections are async and own background tasks, so the window needs
# a handle on the runtime Tauri is already running on rather than a second one.
tokio = { version = "1", features = ["sync", "rt", "time", "process", "io-util"] }
toml_edit = "0.25.13"
# Finding an agent's executable. Hand-rolling a PATH walk means re-deciding what
# an executable is on each platform — `which` is that decision, already made,
# and its `which_in` takes the PATH to search rather than reading the process's
# own, which is the whole reason this is not `std`: a bundled `.app` launched
# from Finder inherits almost no PATH, and every agent on this machine lives
# somewhere a login shell puts there and Finder does not.
which = "8"

# The Dock icon's menu. macOS asks the application delegate for it and Tao's
# delegate does not answer, so `src/dock.rs` adds the method to it — which is
# the Objective-C runtime and these crates' typed bindings to it. They are
# already in the tree under Tauri; they are named here because this crate calls
# them directly.
[target.'cfg(target_os = "macos")'.dependencies]
# What makes the panel a panel rather than a window. A Spotlight-like surface
# has to take the keyboard without taking the application in front of it away
# from somebody, and that is one AppKit class — `NSPanel` with
# `NonactivatingPanel` — which Tauri cannot be asked for: it builds an
# `NSWindow`. The crate subclasses the window Tauri built, which is the same
# `objc2` and `objc2-app-kit` already in this tree rather than a second
# toolchain, and it carries the one fix nobody would find twice: `WKWebView`
# does not report its window level to the input method, so candidate windows
# for a non-Latin layout draw *behind* an elevated panel.
tauri-nspanel = "2.1.1"
# The callback halves of the notification interface below: asking for
# permission and hearing that somebody clicked are both blocks.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "std",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", features = [
  "std",
  "NSDictionary",
  "NSObject",
  "NSString",
] }
# The banner somebody can click, which is a different thing from the banner the
# plugin above shows: `UNUserNotificationCenter` is the only interface on this
# system that carries a payload out with a notification and hands it back when
# somebody acts on it. What is carried, and where a click lands, is
# `src/attention/banner.rs`.
objc2-user-notifications = { version = "0.3", features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNUserNotificationCenter",
] }
